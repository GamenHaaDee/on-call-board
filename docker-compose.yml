services:
  rotacall:
    build: .
    ports:
      - "3001:3001"
    volumes:
      # Databasebestand + instellingen blijven hier buiten de container bewaard.
      - rotacall-data:/app/data
    environment:
      PORT: 3001

      # Leeg laten = de database kiezen in de setup-pagina (standaard sqlite in
      # het volume hierboven). Vul "mysql" of "postgres" in om een bestaande
      # databaseserver af te dwingen; vul dan ook de DB_*-regels hieronder in.
      DB_DRIVER: ${DB_DRIVER:-}
      # Laat leeg om de tabelnaam in de setup-pagina te kiezen.
      DB_TABLE: ${DB_TABLE:-}
      # Tabel met de instellingen (rooster, rotatie, mail, tijdzone).
      SETTINGS_TABLE: ${SETTINGS_TABLE:-rotacall_settings}

      # Alleen nodig bij DB_DRIVER=mysql of postgres:
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-}
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_NAME: ${DB_NAME:-}
      # Of, voor Postgres, in één regel:
      DATABASE_URL: ${DATABASE_URL:-}

      # Rooster als JSON (aanbevolen in Portainer, zodat persoonsgegevens niet
      # in de repo/image staan). Bv: [{"name":"Alice","phone":"0600000001"}]
      ROSTER: ${ROSTER:-}
      # Tijdzone van de container; de app-tijdzone is los instelbaar in de UI
      # (of vast te zetten met ROTACALL_TIMEZONE).
      TZ: ${TZ:-Europe/Amsterdam}
      ROTACALL_TIMEZONE: ${ROTACALL_TIMEZONE:-}

      # Leeg laten = instelbaar in de setup-/instellingenpagina.
      ROTATION_ANCHOR_DATE: ${ROTATION_ANCHOR_DATE:-}
      ROTATION_START_TIME: ${ROTATION_START_TIME:-}
      ROTATION_END_TIME: ${ROTATION_END_TIME:-}
      ROTATION_PERIOD_VALUE: ${ROTATION_PERIOD_VALUE:-0}
      ROTATION_WEEKS_AHEAD: ${ROTATION_WEEKS_AHEAD:-}
      CRON_SCHEDULE: ${CRON_SCHEDULE:-5 0 * * 1}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}

      # E-mailmeldingen (kan ook volledig in de instellingenpagina).
      SMTP_ENABLED: ${SMTP_ENABLED:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  rotacall-data:
